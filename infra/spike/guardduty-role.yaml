# LIMITACION (Learner Lab, probado el 2026-10-12 en us-east-1): NO DESPLEGABLE.
# El laboratorio rechaza iam:CreateRole ("no identity-based policy allows the iam:CreateRole action"),
# asi que no se puede crear un rol de servicio propio para GuardDuty. Fuera del laboratorio este template sirve.
# Ver tasks/plan.md, seccion Resultados del spike.
AWSTemplateFormatVersion: '2010-09-09'
Description: Spike (c2) - GuardDuty Malware Protection con un rol de servicio propio (si el Learner Lab permite crear roles)
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
  GdRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: malware-protection-plan.guardduty.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gd-malware-s3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [events:PutRule, events:DeleteRule, events:PutTargets, events:RemoveTargets, events:DescribeRule]
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*'
              - Effect: Allow
                Action: [s3:GetBucketNotification, s3:PutBucketNotification, s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:GetObjectTagging, s3:GetObjectVersionTagging, s3:PutObjectTagging, s3:PutObjectVersionTagging]
                Resource: !Sub '${Bucket.Arn}/*'
  Plan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Properties:
      Role: !GetAtt GdRole.Arn
      ProtectedResource:
        S3Bucket: {BucketName: !Ref Bucket}
      Actions:
        Tagging: {Status: ENABLED}
Outputs:
  BucketName: {Value: !Ref Bucket}
