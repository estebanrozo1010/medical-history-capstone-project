AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: mh-api - API Gateway REST (stage v1, authorizer Cognito) y Lambdas Java 21 con SnapStart (docs/01, docs/07)
Parameters:
  LabRoleArn:
    Type: String
    Description: Rol de las Lambdas y de los logs de API Gateway (LabRole en el Learner Lab)
  AllowedOrigin:
    Type: String
    Default: 'http://localhost:4200'
    # shortcut: un solo origen CORS; en la Tarea 16 pasa a ser la URL del sitio de S3
    Description: Origen del frontend permitido por CORS
Resources:
  # Access logs del stage: API Gateway necesita un rol de CloudWatch a nivel de cuenta
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !Ref LabRoleArn
  AccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/mh-api
      RetentionInDays: 30

  Api:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: mh-api
      StageName: v1
      # Sin tokens ni datos personales: solo el sub del JWT
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogs.Arn
        Format: '{"requestId":"$context.requestId","sub":"$context.authorizer.claims.sub","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.resourcePath","status":"$context.status","latencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency"}'
      # Limite global del stage (Lambda admite 10 ejecuciones simultaneas en el lab)
      MethodSettings:
        - {ResourcePath: '/*', HttpMethod: '*', ThrottlingRateLimit: 10, ThrottlingBurstLimit: 20}
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: Cognito
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          Cognito:
            UserPoolArn: !ImportValue mh-auth-UserPoolArn
      # Sin esto el navegador ve un 401 del authorizer como error de CORS
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"

  ProfileLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/mh-profile
      RetentionInDays: 30
  ProfileFunction:
    Type: AWS::Serverless::Function
    # SnapStart ejecuta el init al publicar la versión y ya escribe logs
    DependsOn: ProfileLogs
    Properties:
      FunctionName: mh-profile
      Role: !Ref LabRoleArn
      Runtime: java21
      Handler: com.mh.historial.adapter.in.lambda.ProfileHandler::handleRequest
      CodeUri: ../backend/adapter-in-lambda/target/mh-lambda.jar
      MemorySize: 1024
      Timeout: 15
      SnapStart: {ApplyOn: PublishedVersions}
      # Publica una versión nueva con cada cambio de código; API Gateway invoca el alias
      AutoPublishAlias: live
      Environment:
        Variables:
          PROFILES_TABLE: mh-profiles
          KMS_KEY_ARN: !ImportValue mh-base-KeyArn
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Crear: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /profile, Method: post}}
        Obtener: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /profile, Method: get}}
        Actualizar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /profile, Method: put}}

  FilesLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/mh-files
      RetentionInDays: 30
  FilesFunction:
    Type: AWS::Serverless::Function
    DependsOn: FilesLogs
    Properties:
      FunctionName: mh-files
      Role: !Ref LabRoleArn
      Runtime: java21
      Handler: com.mh.historial.adapter.in.lambda.FilesHandler::handleRequest
      CodeUri: ../backend/adapter-in-lambda/target/mh-lambda.jar
      MemorySize: 1024
      # DELETE espera hasta 8 s la réplica al respaldo (FilesHandler); si no termina responde 409
      Timeout: 15
      SnapStart: {ApplyOn: PublishedVersions}
      AutoPublishAlias: live
      Environment:
        Variables:
          FILES_TABLE: mh-files
          DOCS_BUCKET: !ImportValue mh-base-DocsBucketName
          BACKUP_BUCKET: !ImportValue mh-base-BackupBucketName
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Listar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /files, Method: get}}
        PedirSubida: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /files/upload-url, Method: post}}
        PedirDescarga: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/files/{fileId}/download-url', Method: get}}
        Eliminar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/files/{fileId}', Method: delete}}
        MultipartIniciar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /files/multipart/start, Method: post}}
        MultipartParte: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /files/multipart/part-url, Method: post}}
        MultipartCompletar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /files/multipart/complete, Method: post}}
        MultipartAbortar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /files/multipart/abort, Method: post}}

  LinksLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/mh-links
      RetentionInDays: 30
  LinksFunction:
    Type: AWS::Serverless::Function
    DependsOn: LinksLogs
    Properties:
      FunctionName: mh-links
      Role: !Ref LabRoleArn
      Runtime: java21
      Handler: com.mh.historial.adapter.in.lambda.LinksHandler::handleRequest
      CodeUri: ../backend/adapter-in-lambda/target/mh-lambda.jar
      MemorySize: 1024
      Timeout: 15
      SnapStart: {ApplyOn: PublishedVersions}
      AutoPublishAlias: live
      Environment:
        Variables:
          LINKS_TABLE: mh-links
          FILES_TABLE: mh-files
          # Base del frontend: la url compartida es {ALLOWED_ORIGIN}/compartido/{token}
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Crear: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /links, Method: post}}
        Listar: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /links, Method: get}}
        CambiarEstado: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/links/{token}', Method: patch}}

  PostScanLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/mh-postscan
      RetentionInDays: 30
  PostScanFunction:
    Type: AWS::Serverless::Function
    DependsOn: PostScanLogs
    Properties:
      FunctionName: mh-postscan
      Role: !Ref LabRoleArn
      Runtime: java21
      Handler: com.mh.historial.adapter.in.lambda.PostScanHandler::handleRequest
      CodeUri: ../backend/adapter-in-lambda/target/mh-lambda.jar
      MemorySize: 1024
      # Incluye hasta 40 s de espera a la réplica antes de borrar un rechazado (S3AlmacenDeArchivos)
      Timeout: 60
      SnapStart: {ApplyOn: PublishedVersions}
      AutoPublishAlias: live
      Environment:
        Variables:
          FILES_TABLE: mh-files
          DOCS_BUCKET: !ImportValue mh-base-DocsBucketName
          BACKUP_BUCKET: !ImportValue mh-base-BackupBucketName
      Events:
        # Invocación asíncrona: si falla (p. ej. réplica aún pendiente), Lambda reintenta 2 veces
        ObjetoCreado:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket:
                  name: [!ImportValue mh-base-DocsBucketName]
Outputs:
  ApiUrl:
    Description: Base de la API (apiUrl del frontend); las rutas cuelgan de aqui sin /api
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1'
    Export: {Name: mh-api-ApiUrl}
